[package]
name = "opencanon-engine"
version = "0.3.10"
license = "MIT"
edition = "2021"
rust-version = "1.95"

[lib]
crate-type = ["cdylib"]

[dependencies]
blake3 = "=1.8.5"
globset = "=0.4.18"
napi = "=3.9.0"
napi-derive = "=3.5.6"
notify = "=9.0.0-rc.4"
oxc_allocator = "=0.128.0"
oxc_ast = "=0.128.0"
oxc_ast_visit = "=0.128.0"
oxc_parser = "=0.128.0"
oxc_semantic = "=0.128.0"
oxc_span = "=0.128.0"
oxc_syntax = "=0.128.0"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[build-dependencies]
napi-build = "=2.3.2"
