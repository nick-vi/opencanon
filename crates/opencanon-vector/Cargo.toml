[package]
name = "opencanon-vector"
version = "0.4.0"
license = "MIT"
edition = "2021"
rust-version = "1.95"
description = "OpenCanon internal vector storage and HNSW search"

[lib]
crate-type = ["rlib"]

[dependencies]
bytemuck = { version = "=1.25.0", features = ["derive"] }
crc32fast = "=1.5.0"
memmap2 = "=0.9.10"
parking_lot = "=0.12.5"
rand = "=0.8.6"
rmp-serde = { version = "=1.3.1", optional = true }
roaring = "=0.11.4"
serde = { version = "=1.0.228", features = ["derive"], optional = true }
thiserror = "=2.0.18"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[features]
default = ["wal"]
wal = ["dep:rmp-serde", "dep:serde"]

[dev-dependencies]
tempfile = "=3.27.0"
