[package]
name = "opencanon-inference"
version = "0.4.7"
license = "MIT"
edition = "2021"
rust-version = "1.95"
description = "OpenCanon native GGUF model runtime for embeddings and generation"

[lib]
crate-type = ["rlib"]

[dependencies]
encoding_rs = "=0.8.35"
hf-hub = "=0.3.2"
llama-cpp-2 = { version = "=0.1.146", default-features = false }
parking_lot = "=0.12.5"
thiserror = "=2.0.18"
tracing = "=0.1.43"

[features]
default = []
metal = ["llama-cpp-2/metal"]
