name: First Run Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  install:
    name: Install From Public Skill
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Smoke install
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          cd "$repo"
          git init
          npx -y skills add nick-vi/opencanon --skill opencanon -a codex -y
          test -f .agents/skills/opencanon/SKILL.md
          test ! -e .agents/skills/opencanon/scripts/opencanon.mjs
          test ! -e .agents/skills/opencanon/runtime/cli.js
          grep -q "text-only" .agents/skills/opencanon/SKILL.md
