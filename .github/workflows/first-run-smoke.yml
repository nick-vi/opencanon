name: First Run Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  install:
    name: Install From Public Skill
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Smoke install
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          cd "$repo"
          git init --initial-branch main
          npx -y skills add nick-vi/opencanon --skill opencanon -a codex -y
          skill=".agents/skills/opencanon/SKILL.md"

          require_file() {
            test -f "$1" || {
              echo "Missing expected file: $1" >&2
              exit 1
            }
          }

          reject_path() {
            test ! -e "$1" || {
              echo "Unexpected bundled runtime path: $1" >&2
              exit 1
            }
          }

          require_text() {
            grep -q "$1" "$2" || {
              echo "Missing expected text in $2: $1" >&2
              exit 1
            }
          }

          require_file "$skill"
          reject_path .agents/skills/opencanon/scripts/opencanon.mjs
          reject_path .agents/skills/opencanon/runtime/cli.js
          require_text "OpenCanon is installed as a runtime" "$skill"
          require_text "opencanon brief --format json" "$skill"
