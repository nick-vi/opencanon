name: First Run Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  install:
    name: Install From Public Skill
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Smoke install
        run: |
          set -euo pipefail
          repo="$(mktemp -d)"
          cd "$repo"
          git init
          npx -y skills add nick-vi/opencanon --skill opencanon -a codex -y
          bun .agents/skills/opencanon/scripts/opencanon.ts setup --yes --hooks codex --no-daemon
          bun run opencanon update check --manifest https://github.com/nick-vi/opencanon/releases/latest/download/opencanon-runtime-manifest.json
          git check-ignore --quiet .agents/skills/opencanon/runtime/cli.js
          git check-ignore --quiet .opencanon/setup.json
          bun run opencanon doctor
