name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Rust components
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Install cargo-audit
        run: cargo +1.95.0 install cargo-audit --version 0.22.2 --locked

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: npm run check:ci:quality

  runtime-integration:
    name: Runtime integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Install dependencies
        run: npm ci

      - name: Build native engine
        run: npm run build:engine

      - name: Run runtime integration tests serially
        run: npm run test:runtime-integration
