name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Rust components
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check:ci

      - name: Verify committed launcher is in sync with its source
        # check:ci rebuilds the shipped launcher (opencanon.mjs) from opencanon.ts. If the
        # committed artifact drifted from its source, fail so a stale/hand-edited bundle
        # (which ships the security-critical fetch + signature-verify code) can't slip out.
        run: git diff --exit-code -- .agents/skills/opencanon/scripts/opencanon.mjs
