name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package"
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Rust components
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run check:ci

  build-engine:
    name: Engine ${{ matrix.target }}
    needs:
      - preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-24.04
          - target: win32-x64
            os: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install Rust components
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Build engine runtime
        run: npm run build:engine

      - name: Collect engine runtime
        id: engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            darwin-arm64) expected_file="opencanon.darwin-arm64.node" ;;
            darwin-x64) expected_file="opencanon.darwin-x64.node" ;;
            linux-arm64) expected_file="opencanon.linux-arm64-gnu.node" ;;
            linux-x64) expected_file="opencanon.linux-x64-gnu.node" ;;
            win32-x64) expected_file="opencanon.win32-x64-msvc.node" ;;
            *)
              echo "Unsupported engine target: $TARGET" >&2
              exit 1
              ;;
          esac

          expected_source="packages/engine/binaries/${expected_file}"

          shopt -s nullglob
          engine_files=(packages/engine/binaries/opencanon.*.node)
          if (( ${#engine_files[@]} != 1 )); then
            echo "Expected exactly one engine runtime for ${TARGET}, found ${#engine_files[@]}." >&2
            printf '%s\n' "${engine_files[@]}" >&2
            exit 1
          fi
          if [[ "${engine_files[0]}" != "$expected_source" ]]; then
            echo "Expected ${expected_source}, found ${engine_files[0]}." >&2
            exit 1
          fi

          mkdir -p dist/engine
          cp "$expected_source" "dist/engine/${expected_file}"
          echo "file=dist/engine/${expected_file}" >> "$GITHUB_OUTPUT"

      - name: Upload engine runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: engine-${{ matrix.target }}
          path: ${{ steps.engine.outputs.file }}
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs:
      - preflight
      - build-engine
    runs-on: ubuntu-24.04
    # The signing secret (OPENCANON_RELEASE_PRIVATE_KEY) lives in this Environment. Configure
    # required reviewers + a tag restriction on it in repo Settings -> Environments so each
    # signed release needs explicit human approval. Until configured it is unprotected but
    # harmless.
    environment: release
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build runtime archive inputs
        run: npm run build:runtime -- --skip-engine

      - name: Download engine runtimes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: engine-*
          path: dist/engine
          merge-multiple: true

      - name: Create runtime manifest
        shell: bash
        env:
          # Ed25519 private key (PKCS#8 PEM) that signs the manifest. Generated with
          # `npm run release:keygen`; its public half is committed in release-keys.ts.
          # --require-signature makes a missing key a hard failure so releases are never
          # published unsigned. The emitted <manifest>.sig files ship via dist/release/*.
          OPENCANON_RELEASE_PRIVATE_KEY: ${{ secrets.OPENCANON_RELEASE_PRIVATE_KEY }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          runtime_version="${tag#v}"
          npm run release:manifest -- --asset-dir dist/engine --out-dir dist/release --asset-base-url . --channel stable --require-all --require-runtime --require-signature --clean --runtime-version "$runtime_version"

      - name: Attest release assets
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: dist/release/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          notes_file="$(mktemp)"
          if [[ -f CHANGELOG.md ]]; then
            awk -v tag="$tag" -v version="$version" '
              function matches_heading(value) {
                return $0 == "## " value || index($0, "## " value " ") == 1 || index($0, "## [" value "]") == 1
              }
              matches_heading(tag) || matches_heading(version) { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            echo "OpenCanon $tag" > "$notes_file"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes_file"
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --verify-tag --title "$tag" --notes-file "$notes_file"
          fi
