name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-engine:
    name: Engine ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: darwin-x64
            os: macos-15-intel
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-24.04
          - target: win32-x64
            os: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun ci

      - name: Install Rust components
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Build engine runtime
        run: bun run build:engine

      - name: Collect engine runtime
        id: engine
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          case "$TARGET" in
            darwin-arm64) expected_file="opencanon.darwin-arm64.node" ;;
            darwin-x64) expected_file="opencanon.darwin-x64.node" ;;
            linux-arm64) expected_file="opencanon.linux-arm64-gnu.node" ;;
            linux-x64) expected_file="opencanon.linux-x64-gnu.node" ;;
            win32-x64) expected_file="opencanon.win32-x64-msvc.node" ;;
            *)
              echo "Unsupported engine target: $TARGET" >&2
              exit 1
              ;;
          esac

          expected_source="packages/engine/binaries/${expected_file}"

          shopt -s nullglob
          engine_files=(packages/engine/binaries/opencanon.*.node)
          if (( ${#engine_files[@]} != 1 )); then
            echo "Expected exactly one engine runtime for ${TARGET}, found ${#engine_files[@]}." >&2
            printf '%s\n' "${engine_files[@]}" >&2
            exit 1
          fi
          if [[ "${engine_files[0]}" != "$expected_source" ]]; then
            echo "Expected ${expected_source}, found ${engine_files[0]}." >&2
            exit 1
          fi

          mkdir -p dist/engine
          cp "$expected_source" "dist/engine/${expected_file}"
          echo "file=dist/engine/${expected_file}" >> "$GITHUB_OUTPUT"

      - name: Upload engine runtime
        uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.target }}
          path: ${{ steps.engine.outputs.file }}
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: build-engine
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun ci

      - name: Build skill runtime archive inputs
        run: |
          bun run ui:build
          bun run build:skill-runtime -- --skip-engine

      - name: Download engine runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: engine-*
          path: dist/engine
          merge-multiple: true

      - name: Create runtime manifest
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          skill_version="${tag#v}"
          bun run release:manifest -- --asset-dir dist/engine --out-dir dist/release --asset-base-url . --channel stable --require-all --require-runtime --clean --skill-version "$skill_version"

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          notes_file="$(mktemp)"
          if [[ -f CHANGELOG.md ]]; then
            awk -v tag="$tag" -v version="$version" '
              function matches_heading(value) {
                return $0 == "## " value || index($0, "## " value " ") == 1 || index($0, "## [" value "]") == 1
              }
              matches_heading(tag) || matches_heading(version) { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$notes_file"
          fi
          if [[ ! -s "$notes_file" ]]; then
            echo "OpenCanon $tag" > "$notes_file"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes_file"
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --verify-tag --title "$tag" --notes-file "$notes_file"
          fi
